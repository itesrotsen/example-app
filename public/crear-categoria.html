<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Categoría</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        textarea {
            height: 80px;
        }
        
        .buttons {
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .back {
            margin-bottom: 20px;
        }
        
        .back a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back">
            <a href="demo-categorias.html">← Volver</a>
        </div>
        
        <h1>Crear Nueva Categoría</h1>
        
        <form onsubmit="guardar(event)">
            <div class="form-group">
                <label>Nombre *</label>
                <input type="text" id="nombre" required>
            </div>
            
            <div class="form-group">
                <label>Descripción</label>
                <textarea id="descripcion"></textarea>
            </div>
            
            <div class="form-group">
                <label>Categoría Padre</label>
                <select id="padre">
                    <option value="">-- Ninguna --</option>
                    <option value="1">Electrónica</option>
                    <option value="4">Ropa y Moda</option>
                    <option value="7">Hogar y Jardín</option>
                    <option value="8">Deportes</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="activo" checked> Activo
                </label>
            </div>
            
            <div class="buttons">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="demo-categorias.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    
    <script>
        function guardar(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            alert('Categoría "' + nombre + '" creada!');
            window.location.href = 'demo-categorias.html';
        }
    </script>
</body>
</html>
